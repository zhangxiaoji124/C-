services:
  api:
    build: .
    command: ["--role", "api", "--node-id", "compose-api"]
    ports:
      - "8080:8080"
    volumes:
      - orbit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
  worker-1:
    build: .
    command: ["--role", "worker", "--node-id", "compose-worker-1"]
    volumes:
      - orbit-data:/app/data
    restart: unless-stopped
  worker-2:
    build: .
    command: ["--role", "worker", "--node-id", "compose-worker-2"]
    volumes:
      - orbit-data:/app/data
    restart: unless-stopped

volumes:
  orbit-data:
